name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Lint
        run: ruff check .

      - name: Test
        run: |
          pytest --junitxml=test-results.xml

      - name: Demo run
        run: |
          python -m recovery_tester demo --artifacts-dir artifacts

      - name: Build docker image
        run: docker build -t backup-recovery-tester:ci .

      - name: Smoke test docker image
        run: |
          mkdir -p docker-output
          docker run --rm -v "${PWD}/docker-output:/app/output" backup-recovery-tester:ci

      - name: Upload reports and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-and-test-results
          path: |
            artifacts
            docker-output
            test-results.xml
